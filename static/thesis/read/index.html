<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Read the 366-page LOKLOK master's thesis page by page.">
<title>Read the Thesis | LOKLOK</title>
<style>
:root{--crimson:#B31B1B;--crimson-dark:#7C1414;--gold:#C7A252;--paper:#FBF8F3;
  --ink:#1F2430;--slate:#46536B;--line:#DDD3C5;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:#E9E2D5;font-family:var(--sans);color:var(--ink);}
.topbar{background:var(--crimson-dark);color:#fff;border-bottom:3px solid var(--gold);}
.topbar .in{max-width:1180px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.wordmark{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;text-decoration:none;}
.topbar .links{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap;}
.topbar .links a{color:#fff;font-size:12.5px;padding:5px 10px;text-decoration:none;}
.topbar .links a:hover{background:var(--crimson);}
.layout{display:grid;grid-template-columns:290px 1fr;gap:0;max-width:1180px;margin:0 auto;}
.toc{background:var(--paper);border-right:1px solid var(--line);height:calc(100vh - 62px);overflow:auto;padding:12px 10px 40px;}
.toc h3{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson-dark);margin:6px 8px 8px;}
.toc input{width:100%;padding:7px 10px;border:1px solid var(--line);font-size:13px;margin-bottom:8px;background:#fff;}
.toc .item{display:block;font-size:12.5px;color:var(--slate);padding:4px 8px;cursor:pointer;border-left:2px solid transparent;text-decoration:none;}
.toc .item:hover{background:#F2ECE1;}
.toc .item.l1{font-weight:700;color:var(--ink);margin-top:6px;}
.toc .item.l2{padding-left:20px;}
.toc .item.l3{padding-left:32px;color:#6E7787;}
.toc .item.cur{color:var(--crimson-dark);border-left-color:var(--crimson);background:#F5EFE3;}
.viewer{background:#DDD6C8;padding:14px 14px 20px;display:flex;flex-direction:column;align-items:center;height:calc(100vh - 62px);overflow:auto;}
.pageframe{background:#fff;border:1px solid #C9BCA7;box-shadow:0 3px 14px rgba(60,40,20,.18);padding:6px;}
.pageframe img{display:block;max-width:min(92vw,860px);max-height:calc(100vh - 210px);width:auto;height:auto;}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;background:var(--paper);border:1px solid var(--line);padding:7px 12px;border-radius:2px;}
.bar button{font-family:var(--sans);font-size:13px;border:1px solid var(--crimson);background:#fff;color:var(--crimson-dark);padding:6px 13px;cursor:pointer;}
.bar button:hover{background:var(--crimson);color:#fff;}
.bar .pos{font-size:13px;color:var(--slate);min-width:150px;text-align:center;font-variant-numeric:tabular-nums;}
.bar input[type=range]{flex:1;min-width:120px;accent-color:var(--crimson);}
.bar select{font-size:13px;border:1px solid var(--line);padding:6px 8px;background:#fff;}
.bar a{font-size:13px;color:var(--crimson-dark);}
.hint{font-size:11.5px;color:var(--muted,#6E7787);margin-top:6px;text-align:center;}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--crimson);width:0;z-index:50;}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;}
  .toc{display:none;}
}
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<header class="topbar">
  <div class="in">
    <a class="wordmark" href="../index.html">LOKLOK &middot; Read the Thesis</a>
    <nav class="links" aria-label="Back to site">
      <a href="../index.html">Overview</a>
      <a href="../algorithms.html">Algorithms</a>
      <a href="../references.html">References</a>
      <a href="../blueprint.html">Blueprint</a>
      <a href="../results.html">Results</a>
      <a href="../interactive/">Interactive</a>
      <a href="../university.html">University</a>
      <a href="../thesis_final.pdf">PDF</a>
    </nav>
  </div>
</header>

<div class="layout">
  <aside class="toc" aria-label="Table of contents">
    <h3>Contents</h3>
    <input id="filter" type="search" placeholder="Filter sections..." aria-label="Filter sections">
    <div id="toclist"></div>
  </aside>
  <main class="viewer">
    <div class="pageframe"><img id="page" src="../pages/page-001.webp" alt="Thesis page"></div>
    <div class="bar">
      <button id="prev" aria-label="Previous page">&larr; Prev</button>
      <button id="next" aria-label="Next page">Next &rarr;</button>
      <span class="pos" id="pageInfo">Page 1 of 366</span>
      <input id="slider" type="range" min="1" max="366" value="1" aria-label="Jump to page">
      <select id="jump" aria-label="Jump to chapter"></select>
      <a id="dlpage" href="../pages/page-001.webp" target="_blank" rel="noopener">Open page</a>
    </div>
    <div class="hint">Arrow keys and Page Up / Page Down navigate. The page images are 1:1 renders of the submitted PDF; the full text layer is in the PDF itself.</div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var TOTAL = 366;
  var el = {
    img: document.getElementById('page'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    info: document.getElementById('pageInfo'),
    slider: document.getElementById('slider'),
    jump: document.getElementById('jump'),
    dl: document.getElementById('dlpage'),
    list: document.getElementById('toclist'),
    filter: document.getElementById('filter'),
    prog: document.getElementById('prog'),
  };
  var toc = [];
  var cur = 1;

  function pad(n) { return String(n).padStart(3, '0'); }
  function show(n) {
    cur = Math.min(TOTAL, Math.max(1, n));
    el.img.src = '../pages/page-' + pad(cur) + '.webp';
    el.img.alt = 'Thesis page ' + cur;
    el.info.textContent = 'Page ' + cur + ' of ' + TOTAL;
    el.slider.value = cur;
    el.dl.href = '../pages/page-' + pad(cur) + '.webp';
    el.prog.style.width = (cur / TOTAL * 100) + '%';
    var best = null;
    toc.forEach(function (t) {
      if (t.page <= cur && (!best || t.page >= best.page)) best = t;
    });
    if (best) { el.jump.value = best.page; }
    document.querySelectorAll('.toc .item').forEach(function (a) {
      a.classList.toggle('cur', +a.dataset.p === cur || (best && +a.dataset.p === best.page && !document.querySelector('.toc .item.cur[data-p="' + cur + '"]')));
    });
    history.replaceState(null, '', '?p=' + cur);
  }
  function nav(d) { show(cur + d); }

  fetch('../pages/manifest.json').then(function (r) { return r.json(); }).then(function (m) {
    toc = m.toc || [];
    toc.forEach(function (t) {
      var a = document.createElement('a');
      a.className = 'item l' + t.level;
      a.textContent = t.title;
      a.dataset.p = t.page;
      a.href = '#';
      a.addEventListener('click', function (e) { e.preventDefault(); show(t.page); });
      el.list.appendChild(a);
    });
    toc.forEach(function (t) {
      if (t.level === 1) {
        var o = document.createElement('option');
        o.value = t.page; o.textContent = t.title;
        el.jump.appendChild(o);
      }
    });
    el.jump.addEventListener('change', function () { show(+el.jump.value); });
    el.filter.addEventListener('input', function () {
      var q = el.filter.value.toLowerCase();
      document.querySelectorAll('.toc .item').forEach(function (a) {
        a.style.display = a.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    });
  });

  el.prev.addEventListener('click', function () { nav(-1); });
  el.next.addEventListener('click', function () { nav(1); });
  el.slider.addEventListener('input', function () { show(+el.slider.value); });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { nav(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { nav(-1); }
    else if (e.key === 'Home') { show(1); }
    else if (e.key === 'End') { show(TOTAL); }
  });

  var q = new URLSearchParams(location.search).get('p');
  show(q ? +q : 1);
})();
</script>
</body>
</html>
